<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новый год 2027 · Вход</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #07070d;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(167, 139, 250, 0.22), transparent 40%),
      radial-gradient(circle at 85% 30%, rgba(34, 211, 238, 0.15), transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(244, 114, 182, 0.12), transparent 45%);
    color: #e8e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    line-height: 1.5;
    overflow: hidden;
    position: relative;
  }

  /* СНЕЖИНКИ */
  .snow {
    position: fixed;
    top: -10px;
    color: rgba(255, 255, 255, 0.5);
    font-size: 14px;
    pointer-events: none;
    animation: fall linear infinite;
    z-index: 0;
  }
  @keyframes fall {
    0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.8; }
    90% { opacity: 0.8; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  /* ФОНОВЫЕ СВЕЧЕНИЯ */
  body::before,
  body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.5;
    z-index: 0;
    pointer-events: none;
  }

  body::before {
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(167, 139, 250, 0.6), transparent 70%);
    top: -150px;
    left: -150px;
    animation: float1 15s ease-in-out infinite;
  }

  body::after {
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(34, 211, 238, 0.5), transparent 70%);
    bottom: -200px;
    right: -200px;
    animation: float2 18s ease-in-out infinite;
  }

  @keyframes float1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(80px, 60px) scale(1.15); }
  }

  @keyframes float2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-80px, -60px) scale(1.15); }
  }

  /* КОНТЕЙНЕР */
  .welcome {
    position: relative;
    z-index: 2;
    max-width: 480px;
    width: 100%;
    text-align: center;
  }

  /* ГИРЛЯНДА */
  .garland {
    display: flex;
    justify-content: space-between;
    padding: 0 8px;
    margin-bottom: 40px;
    height: 30px;
  }
  .bulb {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    animation: glow 2s ease-in-out infinite;
  }
  .bulb:nth-child(1) { background: #f472b6; box-shadow: 0 0 14px #f472b6; animation-delay: 0s; }
  .bulb:nth-child(2) { background: #22d3ee; box-shadow: 0 0 14px #22d3ee; animation-delay: 0.2s; }
  .bulb:nth-child(3) { background: #facc15; box-shadow: 0 0 14px #facc15; animation-delay: 0.4s; }
  .bulb:nth-child(4) { background: #a78bfa; box-shadow: 0 0 14px #a78bfa; animation-delay: 0.6s; }
  .bulb:nth-child(5) { background: #34d399; box-shadow: 0 0 14px #34d399; animation-delay: 0.8s; }
  .bulb:nth-child(6) { background: #f472b6; box-shadow: 0 0 14px #f472b6; animation-delay: 1s; }
  .bulb:nth-child(7) { background: #22d3ee; box-shadow: 0 0 14px #22d3ee; animation-delay: 1.2s; }
  .bulb:nth-child(8) { background: #facc15; box-shadow: 0 0 14px #facc15; animation-delay: 1.4s; }
  .bulb:nth-child(9) { background: #a78bfa; box-shadow: 0 0 14px #a78bfa; animation-delay: 1.6s; }
  .bulb:nth-child(10) { background: #34d399; box-shadow: 0 0 14px #34d399; animation-delay: 1.8s; }

  @keyframes glow {
    0%, 100% { opacity: 0.4; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  /* ЗАГОЛОВОК */
  .year {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #facc15;
    background: rgba(250, 204, 21, 0.1);
    border: 1px solid rgba(250, 204, 21, 0.3);
    padding: 6px 16px;
    border-radius: 100px;
    margin-bottom: 24px;
    animation: fadeInUp 0.8s ease 0.2s backwards;
  }

  h1 {
    font-size: clamp(38px, 11vw, 64px);
    font-weight: 900;
    letter-spacing: -2px;
    line-height: 1.05;
    background: linear-gradient(135deg, #f472b6 0%, #a78bfa 50%, #22d3ee 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
    animation: fadeInUp 0.8s ease 0.35s backwards;
  }

  h2 {
    font-size: clamp(24px, 7vw, 40px);
    font-weight: 800;
    letter-spacing: -1px;
    color: #f0f0ff;
    margin-bottom: 22px;
    animation: fadeInUp 0.8s ease 0.5s backwards;
  }

  .subtitle {
    font-size: 15px;
    color: #9a9ab0;
    line-height: 1.6;
    max-width: 400px;
    margin: 0 auto 40px;
    animation: fadeInUp 0.8s ease 0.65s backwards;
  }

  .subtitle strong {
    color: #22d3ee;
    font-weight: 700;
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* ЁЛКА / ЗВЕЗДА */
  .tree-star {
    font-size: 88px;
    display: inline-block;
    margin-bottom: 20px;
    filter: drop-shadow(0 0 30px rgba(250, 204, 21, 0.9));
    animation: starPulse 2.5s ease-in-out infinite;
    animation-delay: 0s;
  }

  @keyframes starPulse {
    0%, 100% {
      transform: scale(1) rotate(0deg);
      filter: drop-shadow(0 0 30px rgba(250, 204, 21, 0.9));
    }
    50% {
      transform: scale(1.12) rotate(8deg);
      filter: drop-shadow(0 0 50px rgba(250, 204, 21, 1));
    }
  }

  /* КНОПКА */
  .btn-enter {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 22px 52px;
    background: linear-gradient(135deg, #a78bfa 0%, #7c3aed 100%);
    border: 2px solid #a78bfa;
    border-radius: 20px;
    color: #ffffff;
    font-size: 18px;
    font-weight: 800;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 12px 40px rgba(167, 139, 250, 0.6);
    letter-spacing: 0.5px;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    overflow: hidden;
    animation: fadeInUp 0.8s ease 0.8s backwards, btnPulse 3s ease-in-out 1.5s infinite;
    width: 100%;
    max-width: 340px;
  }

  @keyframes btnPulse {
    0%, 100% { box-shadow: 0 12px 40px rgba(167, 139, 250, 0.6); }
    50% { box-shadow: 0 12px 60px rgba(167, 139, 250, 0.95), 0 0 100px rgba(34, 211, 238, 0.4); }
  }

  .btn-enter::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    transition: left 0.7s ease;
  }

  .btn-enter:hover::before {
    left: 100%;
  }

  .btn-enter:hover {
    transform: translateY(-5px) scale(1.02);
    box-shadow: 0 20px 60px rgba(167, 139, 250, 0.9), 0 0 100px rgba(34, 211, 238, 0.4);
    background: linear-gradient(135deg, #b89cff 0%, #8b5cf6 100%);
  }

  .btn-enter:active {
    transform: translateY(-2px) scale(0.99);
  }

  .btn-enter i {
    font-size: 24px;
    transition: transform 0.3s;
  }

  .btn-enter:hover i {
    transform: translateX(6px);
  }

  /* НИЖНЯЯ ПОДПИСЬ */
  .footer-note {
    margin-top: 36px;
    font-size: 12px;
    color: #5a5a70;
    letter-spacing: 2px;
    animation: fadeInUp 0.8s ease 1s backwards;
  }

  .footer-note i {
    color: #a78bfa;
    margin: 0 6px;
  }

  /* ПРЕДЗАГРУЗКА (мигание) */
  @media (max-width: 480px) {
    .tree-star { font-size: 68px; }
    .btn-enter { padding: 20px 36px; font-size: 16px; }
    .subtitle { font-size: 14px; }
  }

  /* СПЕЦИАЛЬНЫЙ ЭФФЕКТ — МЕРЦАНИЕ ТОЧЕК */
  .dots {
    display: inline-block;
  }

  .dots span {
    animation: dotBlink 1.5s infinite;
    display: inline-block;
  }

  .dots span:nth-child(1) { animation-delay: 0s; }
  .dots span:nth-child(2) { animation-delay: 0.3s; }
  .dots span:nth-child(3) { animation-delay: 0.6s; }

  @keyframes dotBlink {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>

<!-- Заставка -->
<div class="welcome">

  <div class="garland">
    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
    <span class="bulb"></span>
  </div>

  <div class="tree-star">⭐</div>

  <div class="year">Декабрь 2026</div>

  <h1>Новый год</h1>
  <h2>2027</h2>

  <p class="subtitle">
    Добро пожаловать в наш праздничный портал.<br>
    Здесь всё для вечера: <strong>меню, музыка, правила, игры</strong> и многое другое.
  </p>

  <a href="Main_Menu.html" class="btn-enter">
    <i class="bi bi-box-arrow-in-right"></i>
    Войти в меню
  </a>

  <div class="footer-note">
    <i class="bi bi-snow"></i>
    6 человек
    <i class="bi bi-snow"></i>
    31 дек — 2 янв
    <i class="bi bi-snow"></i>
  </div>

</div>

<script>
  // Снежинки
  const snowContainer = document.body;
  const snowChars = ['❄', '❅', '❆', '•', '✦'];
  for (let i = 0; i < 40; i++) {
    const snow = document.createElement('div');
    snow.className = 'snow';
    snow.textContent = snowChars[Math.floor(Math.random() * snowChars.length)];
    snow.style.left = Math.random() * 100 + 'vw';
    snow.style.animationDuration = (Math.random() * 8 + 6) + 's';
    snow.style.animationDelay = (Math.random() * 8) + 's';
    snow.style.fontSize = (Math.random() * 12 + 8) + 'px';
    snow.style.opacity = Math.random() * 0.6 + 0.2;
    snowContainer.appendChild(snow);
  }
</script>

</body>
</html>
