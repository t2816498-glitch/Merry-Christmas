<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · Страница не найдена · Новый год 2027</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #07070d;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(167, 139, 250, 0.18), transparent 40%),
      radial-gradient(circle at 85% 30%, rgba(34, 211, 238, 0.12), transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(244, 114, 182, 0.1), transparent 45%);
    color: #e8e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    line-height: 1.5;
    overflow: hidden;
    position: relative;
  }

  /* СНЕЖИНКИ */
  .snow {
    position: fixed;
    top: -10px;
    color: rgba(255, 255, 255, 0.5);
    font-size: 14px;
    pointer-events: none;
    animation: fall linear infinite;
    z-index: 0;
  }
  @keyframes fall {
    0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.8; }
    90% { opacity: 0.8; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  /* ФОНОВЫЕ СВЕЧЕНИЯ */
  body::before,
  body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.5;
    z-index: 0;
    pointer-events: none;
  }

  body::before {
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(167, 139, 250, 0.55), transparent 70%);
    top: -150px;
    left: -150px;
    animation: float1 15s ease-in-out infinite;
  }

  body::after {
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(244, 114, 182, 0.45), transparent 70%);
    bottom: -200px;
    right: -200px;
    animation: float2 18s ease-in-out infinite;
  }

  @keyframes float1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(80px, 60px) scale(1.15); }
  }

  @keyframes float2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-80px, -60px) scale(1.15); }
  }

  /* КОНТЕЙНЕР */
  .container {
    position: relative;
    z-index: 2;
    max-width: 520px;
    width: 100%;
    text-align: center;
  }

  /* ГИРЛЯНДА */
  .garland {
    display: flex;
    justify-content: space-between;
    padding: 0 8px;
    margin-bottom: 40px;
    height: 30px;
  }
  .bulb {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    animation: glow 2s ease-in-out infinite;
  }
  .bulb:nth-child(1) { background: #f472b6; box-shadow: 0 0 14px #f472b6; animation-delay: 0s; }
  .bulb:nth-child(2) { background: #22d3ee; box-shadow: 0 0 14px #22d3ee; animation-delay: 0.2s; }
  .bulb:nth-child(3) { background: #facc15; box-shadow: 0 0 14px #facc15; animation-delay: 0.4s; }
  .bulb:nth-child(4) { background: #a78bfa; box-shadow: 0 0 14px #a78bfa; animation-delay: 0.6s; }
  .bulb:nth-child(5) { background: #34d399; box-shadow: 0 0 14px #34d399; animation-delay: 0.8s; }
  .bulb:nth-child(6) { background: #f472b6; box-shadow: 0 0 14px #f472b6; animation-delay: 1s; }
  .bulb:nth-child(7) { background: #22d3ee; box-shadow: 0 0 14px #22d3ee; animation-delay: 1.2s; }
  .bulb:nth-child(8) { background: #facc15; box-shadow: 0 0 14px #facc15; animation-delay: 1.4s; }
  .bulb:nth-child(9) { background: #a78bfa; box-shadow: 0 0 14px #a78bfa; animation-delay: 1.6s; }
  .bulb:nth-child(10) { background: #34d399; box-shadow: 0 0 14px #34d399; animation-delay: 1.8s; }

  @keyframes glow {
    0%, 100% { opacity: 0.4; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  /* БОЛЬШАЯ ЦИФРА 404 */
  .code-404 {
    font-size: clamp(96px, 22vw, 160px);
    font-weight: 900;
    letter-spacing: -6px;
    line-height: 1;
    background: linear-gradient(135deg, #f472b6 0%, #a78bfa 50%, #22d3ee 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
    position: relative;
    animation: codePop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(0 0 30px rgba(167, 139, 250, 0.6));
  }

  @keyframes codePop {
    0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
    60% { transform: scale(1.1) rotate(3deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); }
  }

  /* ИКОНКА */
  .error-icon {
    font-size: 64px;
    color: #22d3ee;
    filter: drop-shadow(0 0 24px rgba(34, 211, 238, 0.8));
    margin-bottom: 20px;
    display: inline-block;
    animation: beat 2s ease-in-out infinite;
  }

  @keyframes beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  /* ЗАГОЛОВОК */
  .error-title {
    font-size: clamp(22px, 5vw, 30px);
    font-weight: 800;
    color: #f0f0ff;
    margin-bottom: 14px;
    letter-spacing: -0.5px;
    animation: fadeInUp 0.8s ease 0.2s backwards;
  }

  /* ТЕКСТ */
  .error-text {
    font-size: 15px;
    color: #9a9ab0;
    line-height: 1.7;
    max-width: 440px;
    margin: 0 auto 36px;
    animation: fadeInUp 0.8s ease 0.35s backwards;
  }

  .error-text strong {
    color: #22d3ee;
    font-weight: 700;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* КНОПКИ */
  .buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 340px;
    margin: 0 auto;
    animation: fadeInUp 0.8s ease 0.5s backwards;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 18px 32px;
    border-radius: 18px;
    font-size: 16px;
    font-weight: 800;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: 2px solid transparent;
    letter-spacing: 0.3px;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    overflow: hidden;
  }

  .btn-primary {
    background: linear-gradient(135deg, #a78bfa 0%, #7c3aed 100%);
    border-color: #a78bfa;
    color: #ffffff;
    box-shadow: 0 8px 30px rgba(167, 139, 250, 0.5);
  }

  .btn-primary:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 14px 40px rgba(167, 139, 250, 0.7);
    background: linear-gradient(135deg, #b89cff 0%, #8b5cf6 100%);
  }

  .btn-primary::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    transition: left 0.7s ease;
  }

  .btn-primary:hover::before { left: 100%; }

  .btn-secondary {
    background: rgba(255, 255, 255, 0.04);
    border-color: rgba(167, 139, 250, 0.35);
    color: #d0d0e8;
  }

  .btn-secondary:hover {
    background: rgba(167, 139, 250, 0.12);
    border-color: #a78bfa;
    color: #a78bfa;
    transform: translateY(-4px);
  }

  .btn i { font-size: 20px; }

  /* ПОДПИСЬ ВНИЗУ */
  .footer-note {
    margin-top: 40px;
    font-size: 12px;
    color: #5a5a70;
    letter-spacing: 2px;
    animation: fadeInUp 0.8s ease 0.7s backwards;
  }

  .footer-note i {
    color: #a78bfa;
    margin: 0 6px;
  }

  @media (max-width: 480px) {
    .garland { margin-bottom: 30px; }
    .bulb { width: 10px; height: 10px; }
    .error-icon { font-size: 52px; }
    .btn { padding: 16px 24px; font-size: 15px; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="garland">
    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
    <span class="bulb"></span>
  </div>

  <div class="error-icon">
    <i class="bi bi-compass-fill"></i>
  </div>

  <div class="code-404">404</div>

  <h1 class="error-title">Страница не найдена</h1>

  <p class="error-text">
    Похоже, ты забрёл туда, куда даже Дед Мороз не заглядывает. <strong>Такой страницы нет</strong> — возможно, ссылка устарела или в адресе опечатка.
  </p>

  <div class="buttons">
    <a href="Main_Menu.html" class="btn btn-primary">
      <i class="bi bi-house-door-fill"></i>
      Вернуться в меню
    </a>
    <a href="index.html" class="btn btn-secondary">
      <i class="bi bi-arrow-left"></i>
      На главную
    </a>
  </div>

  <div class="footer-note">
    <i class="bi bi-snow"></i>
    С Новым годом! · 2027
    <i class="bi bi-snow"></i>
  </div>

</div>

<script>
  // Снежинки
  const snowContainer = document.body;
  const snowChars = ['❄', '❅', '❆', '•', '✦'];
  for (let i = 0; i < 40; i++) {
    const snow = document.createElement('div');
    snow.className = 'snow';
    snow.textContent = snowChars[Math.floor(Math.random() * snowChars.length)];
    snow.style.left = Math.random() * 100 + 'vw';
    snow.style.animationDuration = (Math.random() * 8 + 6) + 's';
    snow.style.animationDelay = (Math.random() * 8) + 's';
    snow.style.fontSize = (Math.random() * 12 + 8) + 'px';
    snow.style.opacity = Math.random() * 0.6 + 0.2;
    snowContainer.appendChild(snow);
  }
</script>

</body>
</html>
