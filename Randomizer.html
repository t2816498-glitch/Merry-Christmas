<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Рандомайзер · Новый год 2027</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #07070d;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(167, 139, 250, 0.18), transparent 40%),
      radial-gradient(circle at 85% 30%, rgba(34, 211, 238, 0.12), transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(244, 114, 182, 0.1), transparent 45%);
    color: #e8e8f0;
    min-height: 100vh;
    padding: 24px 16px 60px;
    line-height: 1.5;
    overflow-x: hidden;
    position: relative;
  }

  .snow {
    position: fixed;
    top: -10px;
    color: rgba(255, 255, 255, 0.5);
    font-size: 14px;
    pointer-events: none;
    animation: fall linear infinite;
    z-index: 0;
  }
  @keyframes fall {
    0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.8; }
    90% { opacity: 0.8; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  .container { max-width: 700px; margin: 0 auto; position: relative; z-index: 1; }

  .garland {
    display: flex;
    justify-content: space-between;
    padding: 0 8px;
    margin-bottom: 20px;
    height: 30px;
  }
  .bulb {
    width: 10px; height: 10px;
    border-radius: 50%;
    animation: glow 2s ease-in-out infinite;
  }
  .bulb:nth-child(1) { background: #f472b6; box-shadow: 0 0 12px #f472b6; animation-delay: 0s; }
  .bulb:nth-child(2) { background: #22d3ee; box-shadow: 0 0 12px #22d3ee; animation-delay: 0.2s; }
  .bulb:nth-child(3) { background: #facc15; box-shadow: 0 0 12px #facc15; animation-delay: 0.4s; }
  .bulb:nth-child(4) { background: #a78bfa; box-shadow: 0 0 12px #a78bfa; animation-delay: 0.6s; }
  .bulb:nth-child(5) { background: #34d399; box-shadow: 0 0 12px #34d399; animation-delay: 0.8s; }
  .bulb:nth-child(6) { background: #f472b6; box-shadow: 0 0 12px #f472b6; animation-delay: 1s; }
  .bulb:nth-child(7) { background: #22d3ee; box-shadow: 0 0 12px #22d3ee; animation-delay: 1.2s; }
  .bulb:nth-child(8) { background: #facc15; box-shadow: 0 0 12px #facc15; animation-delay: 1.4s; }
  .bulb:nth-child(9) { background: #a78bfa; box-shadow: 0 0 12px #a78bfa; animation-delay: 1.6s; }
  .bulb:nth-child(10) { background: #34d399; box-shadow: 0 0 12px #34d399; animation-delay: 1.8s; }

  @keyframes glow {
    0%, 100% { opacity: 0.4; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  .back-row { margin-bottom: 20px; }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: #b0b0c8;
    font-size: 14px;
    font-weight: 500;
    padding: 8px 14px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 100px;
    transition: all 0.25s;
  }

  .back-btn:hover {
    color: #a78bfa;
    border-color: rgba(167, 139, 250, 0.5);
    background: rgba(167, 139, 250, 0.1);
    transform: translateX(-3px);
  }

  .back-btn i { font-size: 16px; }

  header { text-align: center; margin-bottom: 32px; }

  header .sub {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #a78bfa;
    background: rgba(167, 139, 250, 0.1);
    border: 1px solid rgba(167, 139, 250, 0.25);
    padding: 5px 14px;
    border-radius: 100px;
    margin-bottom: 14px;
  }

  header h1 {
    font-size: clamp(26px, 6vw, 40px);
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1.1;
    background: linear-gradient(135deg, #f472b6 0%, #a78bfa 50%, #22d3ee 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
  }

  header p { color: #8a8aa0; font-size: 13px; }

  .screen {
    animation: screenIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes screenIn {
    0% { transform: scale(0.95); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .screen.hidden { display: none; }

  /* ВВОД */
  .input-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 24px;
    padding: 22px 20px;
    backdrop-filter: blur(10px);
  }

  .input-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #a78bfa;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .input-label .count {
    margin-left: auto;
    font-size: 11px;
    color: #6a6a80;
    letter-spacing: 0;
    text-transform: none;
    font-weight: 500;
  }

  .name-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    animation: rowIn 0.25s ease-out;
  }

  @keyframes rowIn {
    0% { transform: translateX(-10px); opacity: 0; }
    100% { transform: translateX(0); opacity: 1; }
  }

  .name-input {
    flex: 1;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 15px;
    color: #f0f0ff;
    font-family: inherit;
    transition: all 0.25s;
    outline: none;
  }

  .name-input::placeholder { color: #4a4a60; }

  .name-input:focus {
    border-color: #a78bfa;
    background: rgba(167, 139, 250, 0.08);
    box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.15);
  }

  .remove-btn {
    width: 44px;
    height: 44px;
    min-width: 44px;
    border-radius: 14px;
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #ef4444;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    font-family: inherit;
    animation: rowIn 0.25s ease-out;
  }

  .remove-btn:hover {
    background: rgba(239, 68, 68, 0.25);
    border-color: #ef4444;
    transform: scale(1.05);
  }

  .remove-btn:active { transform: scale(0.94); }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  .btn {
    flex: 1;
    min-width: 120px;
    padding: 16px 20px;
    border-radius: 16px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 1px solid transparent;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:active { transform: scale(0.97); }

  .btn-add {
    background: rgba(34, 211, 238, 0.1);
    border-color: rgba(34, 211, 238, 0.35);
    color: #22d3ee;
  }

  .btn-add:hover {
    background: rgba(34, 211, 238, 0.2);
    border-color: #22d3ee;
    box-shadow: 0 0 20px rgba(34, 211, 238, 0.3);
  }

  .btn-toast {
    background: rgba(250, 204, 21, 0.1);
    border-color: rgba(250, 204, 21, 0.35);
    color: #facc15;
  }

  .btn-toast:hover {
    background: rgba(250, 204, 21, 0.2);
    border-color: #facc15;
    box-shadow: 0 0 20px rgba(250, 204, 21, 0.35);
  }

  .btn-decide {
    background: linear-gradient(135deg, rgba(244, 114, 182, 0.25), rgba(167, 139, 250, 0.25), rgba(34, 211, 238, 0.25));
    border: 2px solid rgba(167, 139, 250, 0.5);
    color: #f0f0ff;
    animation: randomGlow 3s ease-in-out infinite;
  }

  @keyframes randomGlow {
    0%, 100% { box-shadow: 0 0 25px rgba(167, 139, 250, 0.25); }
    50% { box-shadow: 0 0 45px rgba(167, 139, 250, 0.5), 0 0 70px rgba(34, 211, 238, 0.2); }
  }

  .btn-decide:hover {
    transform: translateY(-3px) scale(1.02);
    border-color: #a78bfa;
  }

  .hint {
    text-align: center;
    font-size: 12px;
    color: #5a5a70;
    margin-top: 14px;
  }

  /* КОЛЕСО */
  .wheel-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 26px;
    padding: 10px 0;
  }

  .wheel-wrap {
    position: relative;
    width: 100%;
    max-width: 480px;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .wheel-pointer {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 44px;
    color: #facc15;
    filter: drop-shadow(0 0 14px rgba(250, 204, 21, 0.9));
    z-index: 5;
    line-height: 1;
  }

  .wheel-svg {
    width: 100%;
    height: 100%;
    transform-origin: 50% 50%;
    will-change: transform;
    backface-visibility: hidden;
    filter: drop-shadow(0 0 30px rgba(167, 139, 250, 0.4));
  }

  .wheel-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 28%;
    height: 28%;
    border-radius: 50%;
    background: radial-gradient(circle, #a78bfa 0%, #7c3aed 70%);
    border: 4px solid #07070d;
    box-shadow: 0 0 40px rgba(167, 139, 250, 0.9), inset 0 0 20px rgba(0, 0, 0, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 32px;
    z-index: 3;
  }

  .spinning-text {
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    color: #a78bfa;
    letter-spacing: 1px;
    animation: pulseText 1.2s ease-in-out infinite;
  }

  @keyframes pulseText {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* РЕЗУЛЬТАТ */
  .result-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
    min-height: 60vh;
    gap: 26px;
  }

  .result-badge {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #22d3ee;
    animation: pulseText 1.5s ease-in-out infinite;
  }

  .result-name {
    font-size: clamp(40px, 12vw, 84px);
    font-weight: 900;
    letter-spacing: -2px;
    line-height: 1.05;
    background: linear-gradient(135deg, #f472b6 0%, #a78bfa 50%, #22d3ee 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: resultIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    word-break: break-word;
    padding: 0 8px;
  }

  @keyframes resultIn {
    0% { transform: scale(0.3) rotate(-8deg); opacity: 0; }
    60% { transform: scale(1.15) rotate(2deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); }
  }

  .result-buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 420px;
  }

  /* ТОСТЫ */
  .toast-screen-wrap {
    position: relative;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    height: 70vh;
    min-height: 500px;
    border-radius: 24px;
    overflow: hidden;
    background: linear-gradient(180deg,
      rgba(167, 139, 250, 0.08) 0%,
      rgba(34, 211, 238, 0.04) 50%,
      rgba(244, 114, 182, 0.08) 100%);
    border: 1px solid rgba(167, 139, 250, 0.25);
    backdrop-filter: blur(10px);
  }

  .toast-screen-wrap::before,
  .toast-screen-wrap::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    height: 100px;
    z-index: 3;
    pointer-events: none;
  }

  .toast-screen-wrap::before {
    top: 0;
    background: linear-gradient(180deg, #07070d 0%, transparent 100%);
  }

  .toast-screen-wrap::after {
    bottom: 0;
    background: linear-gradient(0deg, #07070d 0%, transparent 100%);
  }

  .toast-reel {
    position: absolute;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 100px 16px;
    will-change: transform;
    backface-visibility: hidden;
  }

  .toast-item {
    text-align: center;
    font-size: clamp(16px, 3.5vw, 22px);
    font-weight: 800;
    letter-spacing: 1px;
    padding: 14px 20px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    color: #9090b0;
    text-transform: uppercase;
    line-height: 1.2;
    flex-shrink: 0;
  }

  .toast-center-line {
    position: absolute;
    top: 50%;
    left: 12px;
    right: 12px;
    height: 2px;
    background: linear-gradient(90deg,
      transparent,
      rgba(34, 211, 238, 0.6) 20%,
      rgba(34, 211, 238, 1) 50%,
      rgba(34, 211, 238, 0.6) 80%,
      transparent);
    transform: translateY(-50%);
    z-index: 2;
    pointer-events: none;
    box-shadow: 0 0 20px rgba(34, 211, 238, 0.6);
  }

  .toast-center-line::before,
  .toast-center-line::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #22d3ee;
    transform: translateY(-50%);
    box-shadow: 0 0 16px #22d3ee;
  }

  .toast-center-line::before { left: -6px; }
  .toast-center-line::after { right: -6px; }

  .toast-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    width: 100%;
    max-width: 480px;
  }

  @media (max-width: 480px) {
    .input-card { padding: 18px 16px; border-radius: 20px; }
    .name-input { padding: 13px 14px; font-size: 14px; }
    .remove-btn { width: 42px; height: 42px; min-width: 42px; }
    .btn { padding: 15px 16px; font-size: 14px; min-width: 110px; }
    .wheel-wrap { max-width: 340px; }
    .result-screen { min-height: 55vh; padding: 30px 16px; }
    .toast-screen-wrap { height: 65vh; min-height: 420px; }
    .toast-item { font-size: 14px; padding: 12px 14px; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="garland">
    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
  </div>

  <div class="back-row">
    <a href="Main_Menu.html" class="back-btn">
      <i class="bi bi-arrow-left"></i>
      Назад в меню
    </a>
  </div>

  <header>
    <div class="sub">Рандомайзер</div>
    <h1>Кто сегодня главный?</h1>
    <p>Добавь имена или спор — колесо решит за тебя</p>
  </header>

  <!-- ЭКРАН 1: ВВОД -->
  <div class="screen" id="inputScreen">
    <div class="input-card">
      <div class="input-label">
        <i class="bi bi-people-fill"></i>
        Имена или спор
        <span class="count" id="countLabel">2 / 10</span>
      </div>

      <div id="namesContainer"></div>

      <div class="actions" id="actions">
        <button class="btn btn-add" id="addBtn" style="display:none;">
          <i class="bi bi-plus-lg"></i>
          Добавить
        </button>
        <button class="btn btn-toast" id="toastBtn">
          <i class="bi bi-cup-hot-fill"></i>
          Тост
        </button>
        <button class="btn btn-decide" id="decideBtn" style="display:none;">
          <i class="bi bi-shuffle"></i>
          Решить
        </button>
      </div>

      <div class="hint" id="hint">Заполни минимум 2 поля — появится кнопка «Решить»</div>
    </div>
  </div>

  <!-- ЭКРАН 2: КОЛЕСО -->
  <div class="screen hidden" id="wheelScreen">
    <div class="wheel-screen">
      <div class="wheel-wrap">
        <span class="wheel-pointer">▼</span>
        <svg class="wheel-svg" id="wheelSvg" viewBox="0 0 200 200"></svg>
        <div class="wheel-center">
          <i class="bi bi-dice-5-fill"></i>
        </div>
      </div>
      <div class="spinning-text">Крутим колесо...</div>
    </div>
  </div>

  <!-- ЭКРАН 3: РЕЗУЛЬТАТ -->
  <div class="screen hidden" id="resultScreen">
    <div class="result-screen">
      <div class="result-badge">Выпало</div>
      <div class="result-name" id="resultName">—</div>
      <div class="result-buttons">
        <button class="btn btn-decide" id="againBtn" style="flex:1;">
          <i class="bi bi-arrow-clockwise"></i>
          Решить ещё
        </button>
      </div>
    </div>
  </div>

  <!-- ЭКРАН 4: ТОСТЫ -->
  <div class="screen hidden" id="toastScreen">
    <div class="toast-screen-wrap">
      <div class="toast-center-line"></div>
      <div class="toast-reel" id="toastReel"></div>
    </div>
    <div class="toast-actions">
      <button class="btn btn-toast" id="toastBackBtn" style="flex:1;">
        <i class="bi bi-arrow-left"></i>
        К спорам
      </button>
      <button class="btn btn-decide" id="toastAgainBtn" style="flex:1;">
        <i class="bi bi-arrow-clockwise"></i>
        Ещё тост
      </button>
    </div>
  </div>

  <!-- ЭКРАН 5: РЕЗУЛЬТАТ ТОСТА -->
  <div class="screen hidden" id="toastResultScreen">
    <div class="result-screen">
      <div class="result-badge">Выпьем за</div>
      <div class="result-name" id="toastResultName">—</div>
      <div class="result-buttons">
        <button class="btn btn-toast" id="toastBackBtn2" style="flex:1;">
          <i class="bi bi-arrow-left"></i>
          К спорам
        </button>
        <button class="btn btn-decide" id="toastAgainBtn2" style="flex:1;">
          <i class="bi bi-arrow-clockwise"></i>
          Ещё
        </button>
      </div>
    </div>
  </div>

</div>

<script>
  // ===== СНЕЖИНКИ =====
  const snowContainer = document.body;
  const snowChars = ['❄', '❅', '❆', '•', '✦'];
  for (let i = 0; i < 30; i++) {
    const snow = document.createElement('div');
    snow.className = 'snow';
    snow.textContent = snowChars[Math.floor(Math.random() * snowChars.length)];
    snow.style.left = Math.random() * 100 + 'vw';
    snow.style.animationDuration = (Math.random() * 8 + 6) + 's';
    snow.style.animationDelay = (Math.random() * 8) + 's';
    snow.style.fontSize = (Math.random() * 10 + 8) + 'px';
    snow.style.opacity = Math.random() * 0.6 + 0.2;
    snowContainer.appendChild(snow);
  }

  // ===== 50 ТОСТОВ =====
  const TOASTS = [
    'ЗА НАС!',
    'ЗА НОВЫЙ ГОД!',
    'ЗА СЧАСТЬЕ!',
    'ЗА ЛЮБОВЬ!',
    'ЗА РОДНЫХ!',
    'ЗА ДРУЗЕЙ!',
    'ЗА ЗДОРОВЬЕ!',
    'ЗА УДАЧУ!',
    'ЗА МЕЧТЫ!',
    'ЗА БОГАТСТВО!',
    'ЗА СЕМЬЮ!',
    'ЗА МИР!',
    'ЗА СВОБОДУ!',
    'ЗА ВЕРУ!',
    'ЗА НАДЕЖДУ!',
    'ЗА БУДУЩЕЕ!',
    'ЗА ПРОШЛОЕ!',
    'ЗА НАСТОЯЩЕЕ!',
    'ЗА ВСТРЕЧИ!',
    'ЗА НОВЫЕ НАЧАЛА!',
    'ЗА СТАРЫХ ДРУЗЕЙ!',
    'ЗА ТЕХ, КТО РЯДОМ!',
    'ЗА ТЕХ, КТО ДАЛЕКО!',
    'ЗА ТЕХ, КОГО НЕТ С НАМИ!',
    'ЗА РОДИТЕЛЕЙ!',
    'ЗА ДЕТЕЙ!',
    'ЗА БАБУШЕК!',
    'ЗА ДЕДУШЕК!',
    'ЗА БРАТЬЕВ!',
    'ЗА СЕСТЁР!',
    'ЗА МУЖЧИН!',
    'ЗА ЖЕНЩИН!',
    'ЗА КРАСОТУ!',
    'ЗА МОЛОДОСТЬ!',
    'ЗА МУДРОСТЬ!',
    'ЗА ОПЫТ!',
    'ЗА ЮМОР!',
    'ЗА ПРАЗДНИК!',
    'ЗА ВКУСНУЮ ЕДУ!',
    'ЗА ТЁПЛЫЕ ВЕЧЕРА!',
    'ЗА ДОЛГИЕ НОЧИ!',
    'ЗА ПУТЕШЕСТВИЯ!',
    'ЗА ПРИКЛЮЧЕНИЯ!',
    'ЗА РИСК!',
    'ЗА СМЕЛОСТЬ!',
    'ЗА ВТОРЫЕ ШАНСЫ!',
    'ЗА НОВЫЕ ВОЗМОЖНОСТИ!',
    'ЗА ВСЁ ХОРОШЕЕ!',
    'ЗА ДОМ!',
    'ЗА УЮТ!'
  ];

  const MAX = 10;
  let names = ['', ''];

  const namesContainer = document.getElementById('namesContainer');
  const addBtn = document.getElementById('addBtn');
  const decideBtn = document.getElementById('decideBtn');
  const toastBtn = document.getElementById('toastBtn');
  const countLabel = document.getElementById('countLabel');
  const hint = document.getElementById('hint');

  const inputScreen = document.getElementById('inputScreen');
  const wheelScreen = document.getElementById('wheelScreen');
  const resultScreen = document.getElementById('resultScreen');
  const toastScreen = document.getElementById('toastScreen');
  const toastResultScreen = document.getElementById('toastResultScreen');

  const ALL_SCREENS = [inputScreen, wheelScreen, resultScreen, toastScreen, toastResultScreen];

  function renderNames() {
    namesContainer.innerHTML = '';

    names.forEach((value, index) => {
      const row = document.createElement('div');
      row.className = 'name-row';

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'name-input';
      input.placeholder = `Имя или спор ${index + 1}`;
      input.value = value;
      input.maxLength = 30;
      input.addEventListener('input', (e) => {
        names[index] = e.target.value;
        updateButtons();
      });

      row.appendChild(input);

      if (names.length >= 3) {
        const removeBtn = document.createElement('button');
        removeBtn.className = 'remove-btn';
        removeBtn.innerHTML = '<i class="bi bi-x-lg"></i>';
        removeBtn.type = 'button';
        removeBtn.addEventListener('click', () => {
          names.splice(index, 1);
          renderNames();
          updateButtons();
        });
        row.appendChild(removeBtn);
      }

      namesContainer.appendChild(row);
    });

    updateButtons();
  }

  function updateButtons() {
    const filled = names.filter(n => n.trim().length > 0).length;

    countLabel.textContent = `${names.length} / ${MAX}`;

    const allFilled = names.every(n => n.trim().length > 0);
    addBtn.style.display = (allFilled && names.length < MAX) ? 'flex' : 'none';
    decideBtn.style.display = (filled >= 2) ? 'flex' : 'none';

    if (filled < 2) {
      hint.textContent = `Заполни ещё ${2 - filled} ${2 - filled === 1 ? 'поле' : 'поля'} — появится кнопка «Решить»`;
      hint.style.display = 'block';
    } else if (names.length >= MAX) {
      hint.textContent = 'Максимум 10. Жми «Решить»!';
      hint.style.display = 'block';
    } else {
      hint.textContent = '';
      hint.style.display = 'none';
    }
  }

  addBtn.addEventListener('click', () => {
    if (names.length >= MAX) return;
    names.push('');
    renderNames();
  });

  function showScreen(screen) {
    ALL_SCREENS.forEach(s => s.classList.add('hidden'));
    screen.classList.remove('hidden');
  }

  // ===== КОЛЕСО =====
  decideBtn.addEventListener('click', () => {
    const valid = names.map(n => n.trim()).filter(n => n.length > 0);
    if (valid.length < 2) return;
    spinWheel(valid);
  });

  const wheelSvg = document.getElementById('wheelSvg');

  function buildWheel(items) {
    const colors = [
      '#a78bfa', '#22d3ee', '#f472b6', '#facc15',
      '#34d399', '#fb923c', '#818cf8', '#f87171',
      '#4ade80', '#e879f9'
    ];

    const total = items.length;
    const angleStep = 360 / total;
    let svg = '';

    items.forEach((item, i) => {
      const startAngle = i * angleStep;
      const endAngle = (i + 1) * angleStep;

      const startRad = (startAngle - 90) * Math.PI / 180;
      const endRad = (endAngle - 90) * Math.PI / 180;

      const cx = 100, cy = 100, r = 95;
      const x1 = cx + r * Math.cos(startRad);
      const y1 = cy + r * Math.sin(startRad);
      const x2 = cx + r * Math.cos(endRad);
      const y2 = cy + r * Math.sin(endRad);

      const largeArc = angleStep > 180 ? 1 : 0;
      const pathD = `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} Z`;

      const color = colors[i % colors.length];
      svg += `<path d="${pathD}" fill="${color}" stroke="#07070d" stroke-width="0.8" opacity="0.92"/>`;

      const midAngle = startAngle + angleStep / 2;
      const midRad = (midAngle - 90) * Math.PI / 180;
      const textR = r * 0.62;
      const tx = cx + textR * Math.cos(midRad);
      const ty = cy + textR * Math.sin(midRad);

      let rotate = midAngle;
      if (midAngle > 90 && midAngle < 270) rotate += 180;

      const short = item.length > 10 ? item.slice(0, 9) + '…' : item;
      svg += `<text x="${tx}" y="${ty}" fill="#07070d" font-size="7" font-weight="800" text-anchor="middle" dominant-baseline="middle" transform="rotate(${rotate} ${tx} ${ty})" style="pointer-events:none;">${escapeXml(short)}</text>`;
    });

    wheelSvg.innerHTML = svg;
  }

  function escapeXml(s) {
    return s.replace(/[<>&'"]/g, c => ({
      '<': '&lt;', '>': '&gt;', '&': '&amp;', "'": '&apos;', '"': '&quot;'
    }[c]));
  }

  function spinWheel(items) {
    buildWheel(items);
    showScreen(wheelScreen);

    wheelSvg.style.transition = 'none';
    wheelSvg.style.transform = 'rotate(0deg)';

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const winnerIndex = Math.floor(Math.random() * items.length);
        const angleStep = 360 / items.length;
        const winnerCenter = winnerIndex * angleStep + angleStep / 2;

        const fullSpins = 6 * 360;
        const finalAngle = fullSpins - winnerCenter;

        wheelSvg.style.transition = 'transform 5s cubic-bezier(0.16, 1, 0.3, 1)';
        wheelSvg.style.transform = `rotate(${finalAngle}deg)`;

        setTimeout(() => {
          document.getElementById('resultName').textContent = items[winnerIndex];
          showScreen(resultScreen);
        }, 5100);
      });
    });
  }

  document.getElementById('againBtn').addEventListener('click', () => {
    showScreen(inputScreen);
    renderNames();
  });

  // ===== ТОСТЫ =====
  const toastReel = document.getElementById('toastReel');
  let toastTimeout = null;

  function buildToastReel() {
    const shuffled = [...TOASTS].sort(() => Math.random() - 0.5);
    const items = [...shuffled, ...shuffled, ...shuffled];

    toastReel.innerHTML = '';
    items.forEach(t => {
      const div = document.createElement('div');
      div.className = 'toast-item';
      div.textContent = t;
      toastReel.appendChild(div);
    });
  }

  function spinToasts() {
    buildToastReel();
    showScreen(toastScreen);

    toastReel.style.transition = 'none';
    toastReel.style.transform = 'translateY(0px)';

    const itemHeight = 66;
    const duration = 7000;

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const winnerIndex = Math.floor(Math.random() * TOASTS.length);

        const wrapHeight = toastScreen.querySelector('.toast-screen-wrap').clientHeight;
        const centerOffset = wrapHeight / 2;
        const paddingTop = 100;

        const targetShift = paddingTop + winnerIndex * itemHeight + itemHeight / 2 - centerOffset;
        const extraRun = TOASTS.length * itemHeight;
        const finalShift = targetShift + extraRun;

        toastReel.style.transition = `transform ${duration}ms cubic-bezier(0.45, 0.05, 0.15, 1)`;
        toastReel.style.transform = `translateY(${-finalShift}px)`;

        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          document.getElementById('toastResultName').textContent = TOASTS[winnerIndex];
          showScreen(toastResultScreen);
        }, duration + 50);
      });
    });
  }

  toastBtn.addEventListener('click', spinToasts);

  // "Ещё тост" — на экране тостов
  document.getElementById('toastAgainBtn').addEventListener('click', spinToasts);

  // "К спорам" — на экран ввода (сохранённые данные)
  document.getElementById('toastBackBtn').addEventListener('click', () => {
    showScreen(inputScreen);
    renderNames();
  });

  // "Ещё" — на экране результата тоста
  document.getElementById('toastAgainBtn2').addEventListener('click', spinToasts);

  // "К спорам" — на экран ввода (сохранённые данные)
  document.getElementById('toastBackBtn2').addEventListener('click', () => {
    showScreen(inputScreen);
    renderNames();
  });

  // ===== СТАРТ =====
  renderNames();
</script>

</body>
</html>
